<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Play memory</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            background-color: #155724;
            border: 1px solid red;
        }

        .cell {
            background-color: #1c87c9;
            border: 1px solid black;
            min-width: 50px;
            max-width: 400px;
            width: 100%;
            min-height: 50px;
            max-height: 400px;
            height: 100%;
        }
    </style>
</head>
<body class="grid"><div class="cell">1</div><div class="cell">2</div></body>
</html>
